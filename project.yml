name: MeowAlert
options:
  createIntermediateGroups: true
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 13.0
    PRODUCT_BUNDLE_IDENTIFIER: com.noi.meowalert
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Sources/MeowAlert/Info.plist
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  MeowAlert:
    type: application
    platform: macOS
    sources:
      - path: Sources/MeowAlert
        excludes:
          - Resources
          - Assets.xcassets
      - path: Sources/MeowAlert/Resources
        buildPhase: resources
      - path: Sources/MeowAlert/Assets.xcassets
        buildPhase: resources
